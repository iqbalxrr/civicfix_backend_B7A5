services:
  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
      POSTGRES_DB: civicfix
    ports:
      - "5432:5432"
    volumes:
      - civicfix_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: civicfix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  civicfix_pg:
